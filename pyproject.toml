[project]
name = "furiosa-accuracy-harness"
version = "0.1.0"
description = "Five-benchmark accuracy suite (MMLU-Pro, GPQA Diamond, IFEval, LiveCodeBench, AIME 2025) run against an OpenAI-compatible RNGD endpoint"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "huggingface_hub>=0.24",
    "pyarrow>=15",
    # IFEval checker (vendored from google-research/instruction_following_eval)
    "nltk>=3.8",
    "langdetect>=1.0.9",
    "immutabledict>=4.0",
]

[project.scripts]
fah = "fah.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["fah*"]
